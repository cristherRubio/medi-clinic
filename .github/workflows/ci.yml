name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medi_admin
          POSTGRES_PASSWORD: ci-solo-para-pruebas
          POSTGRES_DB: medi_clinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medi_admin -d medi_clinic"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_DB_HOST: localhost
      APP_TEST_DB: "1"
      APP_SECRETS_DIR: ${{ github.workspace }}/secrets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7

      - name: Secretos locales y roles de BD
        run: |
          bash infra/scripts/gen-local-secrets.sh
          bash infra/db/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: ci-solo-para-pruebas
          POSTGRES_USER: medi_admin
          POSTGRES_DB: medi_clinic
          SECRETS_DIR: ${{ github.workspace }}/secrets
          ROLES_SQL: ${{ github.workspace }}/infra/db/roles.sql

      - name: Migraciones
        run: cd backend && uv run alembic upgrade head

      - name: ruff + pytest + mypy
        run: make check

      - name: pip-audit (dependencias de producción)
        run: |
          cd backend
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --redact --verbose

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen del backend
        run: docker build -t medi-clinic-api:ci backend
      - name: Trivy (falla con HIGH/CRITICAL que ya tengan parche)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medi-clinic-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"